<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Baby Care - AI-powered baby emotion detection">
  <title>Baby Care</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Camera View -->
    <div id="camera-container" class="active">
      <video id="camera-feed" autoplay playsinline muted></video>
      <canvas id="face-overlay"></canvas>
      
      <!-- Face Guide Frame -->
      <div id="face-guide">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
      </div>
      
      <!-- Status Bar -->
      <div id="status-bar">
        <span id="connection-status">●</span>
        <span id="time-display"></span>
      </div>
      
      <!-- Top Gradient -->
      <div class="gradient-top"></div>
      
      <!-- Scanning Indicator -->
      <div id="scanning-indicator" class="hidden">
        <div class="scanning-ring"></div>
        <span>Analyzing...</span>
      </div>
      
      <!-- Bottom Controls -->
      <div class="controls-bottom">
        <button id="history-btn" class="icon-btn" aria-label="History">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12,6 12,12 16,14"></polyline>
          </svg>
        </button>
        
        <button id="scan-btn" class="scan-btn" aria-label="Scan">
          <div class="scan-icon"></div>
        </button>
        
        <button id="settings-btn" class="icon-btn" aria-label="Settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- Result Overlay -->
    <div id="result-overlay" class="hidden">
      <div class="result-card">
        <button id="close-result" class="close-btn" aria-label="Close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        
        <div id="emotion-icon" class="emotion-large"></div>
        <h2 id="emotion-name">Detecting...</h2>
        <p id="emotion-description"></p>
        
        <div id="confidence-bar">
          <div id="confidence-fill"></div>
        </div>
        <span id="confidence-text">--% confidence</span>
        
        <div id="suggestions-section">
          <h3>Suggestions</h3>
          <div id="suggestions-list"></div>
        </div>
        
        <button id="scan-again-btn" class="primary-btn">Scan Again</button>
      </div>
    </div>
    
    <!-- History Panel -->
    <div id="history-panel" class="hidden">
      <div class="panel-header">
        <h2>Scan History</h2>
        <button id="close-history" aria-label="Close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="history-list"></div>
      <button id="clear-history" class="danger-btn hidden">Clear All</button>
    </div>
    
    <!-- Settings Panel -->
    <div id="settings-panel" class="hidden">
      <div class="panel-header">
        <h2>Settings</h2>
        <button id="close-settings" aria-label="Close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="settings-content">
        <div class="setting-item">
          <label>
            <span>Auto-save to History</span>
            <input type="checkbox" id="auto-save" checked>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <span>Show Confidence Score</span>
            <input type="checkbox" id="show-confidence" checked>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <span>Sound Effects</span>
            <input type="checkbox" id="sound-effects" checked>
          </label>
        </div>
      </div>
    </div>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loader"></div>
      <p>Initializing Camera...</p>
    </div>
    
    <!-- Error Screen -->
    <div id="error-screen" class="hidden">
      <div class="error-content">
        <div class="error-icon">⚠️</div>
        <h2>Camera Access Required</h2>
        <p>Please allow camera access to scan your baby's emotions.</p>
        <button id="retry-btn" class="primary-btn">Grant Access</button>
      </div>
    </div>
  </div>
  
  <!-- TensorFlow.js for emotion detection -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
